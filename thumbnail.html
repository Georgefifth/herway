<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:800px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 78% 30%,#1a1430 0%,#0d1117 55%,#080b10 100%);
  position:relative;color:#e6e9ef}
.grid{position:absolute;inset:0;opacity:.14;
  background-image:linear-gradient(rgba(167,139,250,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(167,139,250,.5) 1px,transparent 1px);
  background-size:44px 44px}
.glow{position:absolute;width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,.28),transparent 65%);top:-140px;right:-80px}
.glow2{position:absolute;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(103,232,249,.16),transparent 65%);bottom:-160px;left:-60px}
svg.routes{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;top:64px;left:72px;padding:10px 22px;border:1px solid rgba(167,139,250,.55);
  border-radius:999px;font-size:19px;letter-spacing:.16em;color:#c4b5fd;
  background:rgba(167,139,250,.08)}
h1{position:absolute;left:72px;top:210px;font-size:150px;font-weight:800;line-height:1;
  background:linear-gradient(115deg,#fff 20%,#c4b5fd 55%,#67e8f9 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{position:absolute;left:76px;top:390px;font-size:44px;font-weight:300;color:#dbe4f0;max-width:720px;line-height:1.35}
.tag b{color:#67e8f9;font-weight:600}
.chips{position:absolute;left:72px;bottom:72px;display:flex;gap:16px}
.chip{padding:13px 24px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(19,24,32,.82);font-size:23px;color:#c8d2e0}
.chip b{color:#a78bfa}
.score{position:absolute;right:88px;top:120px;width:230px;padding:26px;border-radius:24px;
  background:rgba(19,24,32,.9);border:1px solid rgba(255,255,255,.12);transform:rotate(3deg)}
.score .n{font-size:88px;font-weight:800;color:#5eead4;line-height:1}
.score .l{font-size:20px;color:#8b95a7;margin-top:6px}
.score .row{height:9px;border-radius:5px;background:#1e2530;margin-top:14px;overflow:hidden}
.score .row i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#a78bfa,#67e8f9)}
</style></head><body>
<div class="grid"></div><div class="glow"></div><div class="glow2"></div>
<svg class="routes" viewBox="0 0 1200 800" fill="none">
  <path d="M640 690 C 700 560, 830 540, 880 430 S 990 300, 1060 240" stroke="#facc15" stroke-width="9" opacity=".65" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M640 690 C 780 640, 900 560, 950 420 S 1030 290, 1090 250" stroke="#34d399" stroke-width="11" stroke-linecap="round"/>
  <circle cx="640" cy="690" r="17" fill="#67e8f9" stroke="#0d1117" stroke-width="5"/>
  <circle cx="1090" cy="250" r="17" fill="#f472b6" stroke="#0d1117" stroke-width="5"/>
</svg>
<div class="badge">ACODEMIC × G.I.R.L.S. · GLOBAL SDG HACKATHON</div>
<h1>HerWay</h1>
<div class="tag">Not the fastest way home.<br><b>The safest one.</b></div>
<div class="chips">
  <div class="chip"><b>SDG 5</b> Gender Equality</div>
  <div class="chip"><b>SDG 11</b> Safer Cities</div>
  <div class="chip">transparent safety scoring</div>
</div>
<div class="score">
  <div class="n">71</div><div class="l">SAFEST PICK</div>
  <div class="row"><i style="width:78%"></i></div>
  <div class="row"><i style="width:64%"></i></div>
  <div class="row"><i style="width:52%"></i></div>
</div>
</body></html>
